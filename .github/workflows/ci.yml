name: CI

on:
  push:
  pull_request:

jobs:
  # Generator unit tests (resolver, scaffolder, CLI flag parsing, the
  # file-list snapshot across every valid combination) cross-platform —
  # these are pure Node/TypeScript, no Docker/third-party accounts, so
  # there's no reason they couldn't regress on Windows specifically (path
  # separators, line endings) without this.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.22.0"
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck

  # The ticket 017/018 shared combo matrix (combo-matrix.yml), run
  # against the commit that triggered this push/PR.
  combo-matrix:
    uses: ./.github/workflows/combo-matrix.yml
    with:
      ref: ${{ github.sha }}
