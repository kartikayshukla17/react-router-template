name: Combo matrix

# A reusable workflow (ticket 018): `ci.yml` calls it against the commit
# that triggered the push/PR; the weekly dependency bump (`weekly-
# dependency-bump.yml`) calls the exact same job against its scratch
# branch instead, so "does a dependency bump actually work" is checked
# with the identical matrix on-push CI already trusts, not a second,
# drifting copy of it.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to check out and test.
        type: string
        required: true

jobs:
  # Install + typecheck + build a representative set of real generated
  # projects, on ubuntu only (per PRD.md's "no Cloudflare/Vercel adapters
  # in v1, Node server only" scope — ubuntu is where that server runs).
  # Chosen to cover every database host, ORM, auth provider, storage
  # provider, and realtime provider at least once across 8 combos, not a
  # full cartesian product (that's what combo-snapshot.test.ts's
  # file-list check owns, cheaply, without a real npm install per combo).
  #
  # Three further combos (`runtimeSmoke: true`) go one step past
  # typecheck/build: they actually start the generated server and drive a
  # real sign-up plus note create/list/delete through it
  # (`scripts/smoke-test.mjs`), proving the frontend, backend, and
  # database are wired together correctly at runtime, not just that they
  # compile. Limited to combos with zero external-service dependencies —
  # a self-hosted database (SQLite, Docker Postgres, Docker Mongo) paired
  # with Better Auth, which needs nothing but a secret this job invents.
  # Every other combo needs a real third-party account (Neon, Supabase,
  # Firebase, Clerk, Convex, hosted Mongo, S3) this repo's CI has no
  # secret for, so it stays at typecheck/build only — same reasoning as
  # the Convex combo's `skipTypecheckBuild`, one step earlier in the
  # pipeline.
  combo-matrix:
    runs-on: ubuntu-latest
    services:
      # Job-level, not per-matrix-entry — GitHub Actions has no way to
      # start a service only for some matrix combos, so every combo job
      # gets both, even though only one `runtimeSmoke` combo each
      # (`docker-postgres-...`, `docker-mongo-...`) actually connects to
      # one; the third (`sqlite-...`) uses neither. Idle containers an
      # unrelated combo never touches, not a correctness or secrets
      # concern.
      postgres:
        image: postgres:17-alpine
        env:
          # Matches `providers/database/postgres-docker/docker-compose.yml`'s
          # fixed local-dev credentials exactly, so a generated app's own
          # `DATABASE_URL` default needs no override here beyond pointing
          # at localhost.
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: neon-drizzle-better-auth-s3
            args: >-
              --db postgres --postgres-host neon --orm drizzle
              --auth better-auth --storage s3-presigned
          - name: docker-postgres-prisma-clerk
            args: >-
              --db postgres --postgres-host docker --orm prisma
              --auth clerk
          - name: sqlite-drizzle-firebase-auth-supabase-storage
            args: --db sqlite --orm drizzle --auth firebase-auth --storage supabase-storage
          - name: mongo-docker-mongoose-supabase-auth
            args: --db mongodb --mongo-host docker --orm mongoose --auth supabase-auth
          - name: convex-bundle
            args: --db convex
            # Convex's generated api/dataModel types (convex/_generated/)
            # don't exist until `npx convex dev` runs against a live,
            # authenticated deployment (ticket 012's documented
            # limitation) — not something CI can do without a Convex
            # account's deploy key as a secret, which is out of this
            # ticket's scope. Generate + install still run and still
            # catch a real regression (a missing template file, a broken
            # dependency); typecheck/build are skipped for this combo
            # only, not silently — this comment is why.
            skipTypecheckBuild: true
          - name: empty-stack
            args: ""
          - name: supabase-postgres-drizzle-firebase-storage-realtime
            args: >-
              --db postgres --postgres-host supabase --orm drizzle
              --storage firebase-storage --realtime supabase-realtime
          - name: mongo-hosted-mongoose-clerk-s3
            args: >-
              --db mongodb --mongo-host hosted --orm mongoose
              --auth clerk --storage s3-presigned
          - name: sqlite-drizzle-better-auth-runtime-smoke
            args: --db sqlite --orm drizzle --auth better-auth
            runtimeSmoke: true
            dbPush: true
          - name: docker-postgres-drizzle-better-auth-runtime-smoke
            args: >-
              --db postgres --postgres-host docker --orm drizzle
              --auth better-auth
            runtimeSmoke: true
            dbPush: true
            databaseUrl: postgres://app:app@localhost:5432/app
          - name: docker-mongo-mongoose-better-auth-runtime-smoke
            args: --db mongodb --mongo-host docker --orm mongoose --auth better-auth
            runtimeSmoke: true
            mongodbUri: mongodb://localhost:27017/app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.22.0"
      - run: npm ci
      - run: npm run build --workspace=create-rr-stack
      - name: Generate (${{ matrix.combo.name }})
        run: |
          node packages/create-rr-stack/dist/cli.mjs generated-app \
            ${{ matrix.combo.args }} --yes --no-install --no-git
      - name: Install
        working-directory: generated-app
        run: npm install
      - name: Typecheck
        if: ${{ !matrix.combo.skipTypecheckBuild }}
        working-directory: generated-app
        run: npm run typecheck
      - name: Build
        # `runtimeSmoke` combos skip this: scripts/smoke-test.mjs builds
        # the app itself as its first step, right before starting it —
        # running `npm run build` twice would just waste CI time.
        if: ${{ !matrix.combo.skipTypecheckBuild && !matrix.combo.runtimeSmoke }}
        working-directory: generated-app
        run: npm run build
      - name: Runtime smoke test (${{ matrix.combo.name }})
        if: ${{ matrix.combo.runtimeSmoke }}
        env:
          PORT: "3100"
          BETTER_AUTH_SECRET: ci-smoke-test-secret-not-a-real-credential
          BETTER_AUTH_URL: http://localhost:3100
          DATABASE_URL: ${{ matrix.combo.databaseUrl }}
          MONGODB_URI: ${{ matrix.combo.mongodbUri }}
        run: |
          node packages/create-rr-stack/scripts/smoke-test.mjs generated-app \
            ${{ matrix.combo.dbPush && '--db-push' || '' }}
