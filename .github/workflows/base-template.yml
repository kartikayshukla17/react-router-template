name: base template

on:
  push:
    paths:
      - "templates/base/**"
      - ".github/workflows/base-template.yml"

jobs:
  install-typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.22.0"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
