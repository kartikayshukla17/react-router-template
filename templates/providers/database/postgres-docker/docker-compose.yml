# Postgres for local development, via Docker Compose.
#
# Fixed local-dev credentials (app/app/app) that the generated project's
# DATABASE_URL must match: postgres://app:app@localhost:5432/app. Not a
# production credential — this is a throwaway local container, so there's
# no account-signup step, just `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
